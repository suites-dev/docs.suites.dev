<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 340"
  role="img"
  aria-labelledby="authority-title authority-description"
>
  <title id="authority-title">One-way verification authority chain</title>
  <desc id="authority-description">
    A left-to-right chain moves from human intent to accepted meaning, concrete
    realization, declared selection, runtime evidence, and findings and verdicts.
    Later stages may realize, select, record, or analyze, but cannot redefine
    earlier authority.
  </desc>

  <defs>
    <linearGradient id="authority-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker id="authority-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="6" y="6" width="1188" height="328" rx="16" fill="url(#authority-background)" stroke="#334155" />

  <g font-family="'Hanken Grotesk Local', 'Hanken Grotesk', Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="43" fill="#f8fafc" font-size="24" font-weight="800">Authority moves in one direction</text>
    <text x="34" y="68" fill="#cbd5e1" font-size="15">Each stage acts within the authority established before it.</text>

    <g text-anchor="middle">
      <rect x="34" y="104" width="165" height="126" rx="11" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
      <text x="116.5" y="135" fill="#fde68a" font-size="14" font-weight="800">1</text>
      <text x="116.5" y="177" fill="#fef3c7" font-size="18" font-weight="800">Human intent</text>

      <rect x="227" y="104" width="165" height="126" rx="11" fill="#4a2608" stroke="#f59e0b" stroke-width="2" />
      <text x="309.5" y="135" fill="#fcd34d" font-size="14" font-weight="800">2</text>
      <text x="309.5" y="166" fill="#fff7ed" font-size="17" font-weight="800">Accepted</text>
      <text x="309.5" y="190" fill="#fff7ed" font-size="17" font-weight="800">meaning</text>

      <rect x="420" y="104" width="165" height="126" rx="11" fill="#421622" stroke="#db486f" stroke-width="2" />
      <text x="502.5" y="135" fill="#ef9dab" font-size="14" font-weight="800">3</text>
      <text x="502.5" y="168" fill="#fdf3f5" font-size="18" font-weight="800">Concrete</text>
      <text x="502.5" y="192" fill="#fdf3f5" font-size="18" font-weight="800">realization</text>

      <rect x="613" y="104" width="165" height="126" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="2" />
      <text x="695.5" y="135" fill="#93c5fd" font-size="14" font-weight="800">4</text>
      <text x="695.5" y="168" fill="#eff6ff" font-size="18" font-weight="800">Declared</text>
      <text x="695.5" y="192" fill="#eff6ff" font-size="18" font-weight="800">selection</text>

      <rect x="806" y="104" width="165" height="126" rx="11" fill="#12302a" stroke="#34d399" stroke-width="2" />
      <text x="888.5" y="135" fill="#6ee7b7" font-size="14" font-weight="800">5</text>
      <text x="888.5" y="168" fill="#ecfdf5" font-size="18" font-weight="800">Runtime</text>
      <text x="888.5" y="192" fill="#ecfdf5" font-size="18" font-weight="800">evidence</text>

      <rect x="999" y="104" width="165" height="126" rx="11" fill="#421622" stroke="#e67189" stroke-width="2" />
      <text x="1081.5" y="135" fill="#ef9dab" font-size="14" font-weight="800">6</text>
      <text x="1081.5" y="168" fill="#fdf3f5" font-size="18" font-weight="800">Findings</text>
      <text x="1081.5" y="192" fill="#fdf3f5" font-size="18" font-weight="800">and verdicts</text>
    </g>

    <line x1="199" y1="167" x2="217" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="392" y1="167" x2="410" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="585" y1="167" x2="603" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="778" y1="167" x2="796" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="971" y1="167" x2="989" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />

    <rect x="34" y="265" width="1130" height="40" rx="9" fill="#111827" stroke="#475569" />
    <text x="599" y="290" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="700">
      Later stages may realize, select, record, or analyze. They cannot redefine earlier authority.
    </text>
  </g>
</svg>
