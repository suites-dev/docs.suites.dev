<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 520"
  role="img"
  aria-labelledby="authority-title authority-description"
>
  <title id="authority-title">One-way verification authority chain</title>
  <desc id="authority-description">
    Authority moves from human intent to accepted meaning, concrete realization,
    declared selection, runtime evidence, and findings and verdicts. Later stages
    may realize, select, record, or analyze, but cannot redefine earlier authority.
  </desc>

  <defs>
    <linearGradient id="authority-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker id="authority-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="6" y="6" width="1188" height="508" rx="16" fill="url(#authority-background)" stroke="#334155" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="43" fill="#f8fafc" font-size="21" font-weight="800">Authority moves in one direction</text>
    <text x="34" y="68" fill="#cbd5e1" font-size="13">Each stage acts within the authority established before it.</text>

    <g text-anchor="middle">
      <rect x="34" y="104" width="340" height="126" rx="11" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
      <text x="204" y="136" fill="#fde68a" font-size="10" font-weight="800">1</text>
      <text x="204" y="180" fill="#fef3c7" font-size="20" font-weight="800">Human intent</text>

      <rect x="430" y="104" width="340" height="126" rx="11" fill="#4a2608" stroke="#f59e0b" stroke-width="2" />
      <text x="600" y="136" fill="#fcd34d" font-size="10" font-weight="800">2</text>
      <text x="600" y="180" fill="#fff7ed" font-size="20" font-weight="800">Accepted meaning</text>

      <rect x="826" y="104" width="340" height="126" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2" />
      <text x="996" y="136" fill="#c4b5fd" font-size="10" font-weight="800">3</text>
      <text x="996" y="180" fill="#f5f3ff" font-size="20" font-weight="800">Concrete realization</text>

      <rect x="826" y="286" width="340" height="126" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="2" />
      <text x="996" y="318" fill="#93c5fd" font-size="10" font-weight="800">4</text>
      <text x="996" y="362" fill="#eff6ff" font-size="20" font-weight="800">Declared selection</text>

      <rect x="430" y="286" width="340" height="126" rx="11" fill="#12302a" stroke="#34d399" stroke-width="2" />
      <text x="600" y="318" fill="#6ee7b7" font-size="10" font-weight="800">5</text>
      <text x="600" y="362" fill="#ecfdf5" font-size="20" font-weight="800">Runtime evidence</text>

      <rect x="34" y="286" width="340" height="126" rx="11" fill="#3b164f" stroke="#c084fc" stroke-width="2" />
      <text x="204" y="318" fill="#d8b4fe" font-size="10" font-weight="800">6</text>
      <text x="204" y="352" fill="#faf5ff" font-size="19" font-weight="800">Findings</text>
      <text x="204" y="378" fill="#faf5ff" font-size="19" font-weight="800">and verdicts</text>
    </g>

    <line x1="374" y1="167" x2="420" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="770" y1="167" x2="816" y2="167" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="996" y1="230" x2="996" y2="276" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="826" y1="349" x2="780" y2="349" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />
    <line x1="430" y1="349" x2="384" y2="349" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#authority-arrow)" />

    <rect x="34" y="444" width="1132" height="42" rx="9" fill="#111827" stroke="#475569" />
    <text x="600" y="470" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">
      Later stages may realize, select, record, or analyze. They cannot redefine earlier authority.
    </text>
  </g>
</svg>
