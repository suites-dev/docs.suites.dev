<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 350"
  role="img"
  aria-labelledby="odc-title odc-description"
>
  <title id="odc-title">Observable Decision Coverage comparison outcomes</title>
  <desc id="odc-description">
    An accepted comparison defines exact members, varying and controlled
    dimensions, decision scope, and an effect projection. Decision evidence and
    sealed effect evidence enter offline eligibility checks. An eligible
    comparison establishes an association when projected signatures differ and
    does not establish an association when they are identical. Missing,
    incomplete, foreign, or confounded prerequisites make the comparison
    unavailable. Association is not causation or correctness.
  </desc>
  <defs>
    <linearGradient id="odc-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker id="odc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect x="6" y="6" width="1188" height="338" rx="16" fill="url(#odc-background)" stroke="#334155" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="44" fill="#f8fafc" font-size="24" font-weight="800">ODC compares declared cases, not convenient runs</text>

    <g text-anchor="middle">
      <rect x="34" y="82" width="230" height="210" rx="11" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
      <text x="149" y="112" fill="#fde68a" font-size="14" font-weight="800">PERSON APPROVED</text>
      <text x="149" y="148" fill="#fef3c7" font-size="19" font-weight="800">Comparison</text>
      <text x="149" y="180" fill="#fde68a" font-size="15">exact member cases</text>
      <text x="149" y="204" fill="#fde68a" font-size="14">varying + controlled dimensions</text>
      <text x="149" y="228" fill="#fde68a" font-size="15">decision scope</text>
      <text x="149" y="252" fill="#fde68a" font-size="15">effect projection</text>
    </g>

    <g text-anchor="middle">
      <rect x="304" y="82" width="220" height="210" rx="11" fill="#172554" stroke="#60a5fa" stroke-width="2" />
      <text x="414" y="112" fill="#93c5fd" font-size="14" font-weight="800">EXACT EXECUTIONS</text>
      <text x="414" y="148" fill="#eff6ff" font-size="19" font-weight="800">Evidence</text>
      <rect x="330" y="172" width="168" height="38" rx="7" fill="#0f172a" stroke="#3b82f6" />
      <text x="414" y="196" fill="#bfdbfe" font-size="15">decision evidence</text>
      <rect x="330" y="220" width="168" height="38" rx="7" fill="#0f172a" stroke="#3b82f6" />
      <text x="414" y="244" fill="#bfdbfe" font-size="15">sealed effect evidence</text>
    </g>

    <g text-anchor="middle">
      <rect x="564" y="82" width="220" height="210" rx="11" fill="#12302a" stroke="#34d399" stroke-width="2" />
      <text x="674" y="112" fill="#6ee7b7" font-size="14" font-weight="800">OFFLINE</text>
      <text x="674" y="148" fill="#ecfdf5" font-size="19" font-weight="800">Check eligibility</text>
      <text x="674" y="184" fill="#a7f3d0" font-size="15">exact attempts</text>
      <text x="674" y="208" fill="#a7f3d0" font-size="15">complete inputs</text>
      <text x="674" y="232" fill="#a7f3d0" font-size="15">verified controls</text>
      <text x="674" y="256" fill="#a7f3d0" font-size="15">then compare</text>
    </g>

    <g text-anchor="middle">
      <rect x="824" y="82" width="342" height="210" rx="11" fill="#2e1065" stroke="#c084fc" stroke-width="2" />
      <text x="995" y="104" fill="#d8b4fe" font-size="14" font-weight="800">ALPHA TARGET</text>
      <text x="995" y="130" fill="#faf5ff" font-size="18" font-weight="800">ODC result</text>

      <rect x="844" y="143" width="302" height="40" rx="7" fill="#14301f" stroke="#4ade80" />
      <text x="995" y="159" fill="#dcfce7" font-size="14" font-weight="800">ASSOCIATION ESTABLISHED</text>
      <text x="995" y="176" fill="#bbf7d0" font-size="14">distinguishable signatures</text>

      <rect x="844" y="190" width="302" height="40" rx="7" fill="#172554" stroke="#60a5fa" />
      <text x="995" y="206" fill="#dbeafe" font-size="14" font-weight="800">ASSOCIATION NOT ESTABLISHED</text>
      <text x="995" y="223" fill="#bfdbfe" font-size="14">identical signatures</text>

      <rect x="844" y="237" width="302" height="47" rx="7" fill="#111827" stroke="#64748b" />
      <text x="995" y="251" fill="#e2e8f0" font-size="14" font-weight="800">UNAVAILABLE</text>
      <text x="995" y="267" fill="#cbd5e1" font-size="13">missing / incomplete / foreign</text>
      <text x="995" y="281" fill="#cbd5e1" font-size="13">or confounded prerequisites</text>
    </g>

    <line x1="264" y1="187" x2="294" y2="187" stroke="#94a3b8" stroke-width="2" marker-end="url(#odc-arrow)" />
    <line x1="524" y1="187" x2="554" y2="187" stroke="#94a3b8" stroke-width="2" marker-end="url(#odc-arrow)" />
    <line x1="784" y1="187" x2="814" y2="187" stroke="#94a3b8" stroke-width="2" marker-end="url(#odc-arrow)" />

    <text x="34" y="325" fill="#94a3b8" font-size="15">Association is not causation or correctness.</text>
    <text x="1166" y="325" text-anchor="end" fill="#64748b" font-size="15">Observable Decision Coverage</text>
  </g>
</svg>
