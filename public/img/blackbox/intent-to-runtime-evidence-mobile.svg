<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 420 630"
  role="img"
  aria-labelledby="intent-finding-mobile-title intent-finding-mobile-description"
>
  <title id="intent-finding-mobile-title">From product requirements to a Blackbox finding</title>
  <desc id="intent-finding-mobile-description">
    Product requirements become a human-approved behavioral contract. A system
    or end-to-end test realizes the contract, OpenTelemetry reveals runtime
    effects, and Blackbox returns a finding.
  </desc>

  <defs>
    <marker
      id="intent-finding-mobile-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <g
    font-family="'Hanken Grotesk Local', 'Hanken Grotesk', Inter, ui-sans-serif, system-ui, sans-serif"
    text-anchor="middle"
  >
    <rect x="44" y="18" width="332" height="92" rx="10" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
    <text x="210" y="71" fill="#fef3c7" font-size="20" font-weight="800">Product requirements</text>

    <line x1="210" y1="110" x2="210" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#intent-finding-mobile-arrow)" />

    <rect x="44" y="138" width="332" height="92" rx="10" fill="#421622" stroke="#e67189" stroke-width="2" />
    <text x="210" y="177" fill="#fdf3f5" font-size="20" font-weight="800">Behavioral spec</text>
    <text x="210" y="203" fill="#f6c9d1" font-size="14" font-weight="700">Approved behavioral contract</text>

    <line x1="210" y1="230" x2="210" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#intent-finding-mobile-arrow)" />

    <rect x="44" y="258" width="332" height="92" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="2" />
    <text x="210" y="311" fill="#eff6ff" font-size="20" font-weight="800">System or E2E test</text>

    <line x1="210" y1="350" x2="210" y2="370" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#intent-finding-mobile-arrow)" />

    <rect x="44" y="378" width="332" height="92" rx="10" fill="#12251e" stroke="#4ade80" stroke-width="2" />
    <text x="210" y="417" fill="#f0fdf4" font-size="20" font-weight="800">OpenTelemetry</text>
    <text x="210" y="443" fill="#bbf7d0" font-size="15" font-weight="700">runtime effects</text>

    <line x1="210" y1="470" x2="210" y2="490" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#intent-finding-mobile-arrow)" />

    <rect x="44" y="498" width="332" height="92" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2" />
    <text x="210" y="537" fill="#f5f3ff" font-size="20" font-weight="800">Blackbox</text>
    <text x="210" y="563" fill="#ddd6fe" font-size="16" font-weight="700">finding</text>
  </g>
</svg>
