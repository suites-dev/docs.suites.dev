<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="system-e2e-title system-e2e-description"
>
  <title id="system-e2e-title">One system execution, two verification results</title>
  <desc id="system-e2e-description">
    One checkout execution produces two parallel conclusions. The native
    assertion passes because the test sees one confirmation and one order ID.
    The Blackbox effect finding is violated because runtime evidence contains
    two charge requests while the accepted upper bound is one.
  </desc>

  <defs>
    <linearGradient id="system-e2e-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker
      id="system-e2e-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect
    x="6"
    y="6"
    width="1188"
    height="348"
    rx="16"
    fill="url(#system-e2e-background)"
    stroke="#334155"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="43" fill="#f8fafc" font-size="21" font-weight="800">
      Same execution, different verification questions
    </text>
    <text x="34" y="68" fill="#cbd5e1" font-size="13">
      Both conclusions describe the same checkout attempt.
    </text>

    <g text-anchor="middle">
      <rect
        x="34"
        y="100"
        width="300"
        height="194"
        rx="11"
        fill="#172554"
        stroke="#60a5fa"
        stroke-width="2"
      />
      <text x="184" y="131" fill="#93c5fd" font-size="11" font-weight="800">
        SYSTEM OR E2E SUITE
      </text>
      <text x="184" y="171" fill="#eff6ff" font-size="19" font-weight="800">
        Checkout execution
      </text>
      <text x="184" y="204" fill="#bfdbfe" font-size="13">
        retry completes
      </text>
      <text x="184" y="229" fill="#bfdbfe" font-size="13">
        native assertions run
      </text>
      <text x="184" y="254" fill="#bfdbfe" font-size="13">
        runtime evidence is captured
      </text>
    </g>

    <path
      d="M334 197H397V137H447"
      fill="none"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#system-e2e-arrow)"
    />
    <path
      d="M397 197V257H447"
      fill="none"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#system-e2e-arrow)"
    />

    <g>
      <rect
        x="457"
        y="88"
        width="709"
        height="98"
        rx="11"
        fill="#12302a"
        stroke="#4ade80"
        stroke-width="2"
      />
      <text x="484" y="118" fill="#86efac" font-size="11" font-weight="800">
        NATIVE ASSERTION
      </text>
      <text x="484" y="153" fill="#f0fdf4" font-size="20" font-weight="800">
        PASS
      </text>
      <text x="594" y="152" fill="#bbf7d0" font-size="14">
        One confirmation and one order ID
      </text>
      <text x="1138" y="118" text-anchor="end" fill="#86efac" font-size="12">
        Did the visible result match?
      </text>
    </g>

    <g>
      <rect
        x="457"
        y="208"
        width="709"
        height="98"
        rx="11"
        fill="#3b1820"
        stroke="#fb7185"
        stroke-width="2"
      />
      <text x="484" y="238" fill="#fda4af" font-size="11" font-weight="800">
        BLACKBOX EFFECT FINDING
      </text>
      <text x="484" y="273" fill="#fff1f2" font-size="20" font-weight="800">
        VIOLATED
      </text>
      <text x="615" y="272" fill="#fecdd3" font-size="14">
        Two charge requests observed; accepted upper bound is one
      </text>
      <text x="1138" y="238" text-anchor="end" fill="#fda4af" font-size="12">
        Did boundary behavior satisfy the claim?
      </text>
    </g>
  </g>
</svg>
