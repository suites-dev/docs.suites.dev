<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 430"
  role="img"
  aria-labelledby="observation-title observation-description"
>
  <title id="observation-title">From OpenTelemetry observation to effect finding</title>
  <desc id="observation-description">
    A person-approved effect claim and sealed evidence from a fresh runtime
    attempt meet only at the Analyzer. OpenTelemetry spans from the attempt are
    admitted through the effects catalog and normalized into portable effects
    before the evidence is sealed. A span is evidence input, not automatically
    an effect, and runtime observations never create or change the accepted
    claim.
  </desc>

  <defs>
    <linearGradient id="observation-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker
      id="observation-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
    <marker
      id="claim-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#fbbf24" />
    </marker>
    <marker
      id="evidence-arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#4ade80" />
    </marker>
  </defs>

  <rect
    x="6"
    y="6"
    width="1188"
    height="418"
    rx="16"
    fill="url(#observation-background)"
    stroke="#334155"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="43" fill="#f8fafc" font-size="20" font-weight="800">
      From observation to finding
    </text>
    <text x="34" y="67" fill="#cbd5e1" font-size="12">
      Accepted policy and runtime evidence stay separate until analysis.
    </text>

    <g text-anchor="middle">
      <rect
        x="34"
        y="94"
        width="250"
        height="86"
        rx="10"
        fill="#3b2f0b"
        stroke="#fbbf24"
        stroke-width="2"
      />
      <text x="159" y="119" fill="#fde68a" font-size="9" font-weight="800">
        PERSON APPROVED
      </text>
      <text x="159" y="148" fill="#fef3c7" font-size="16" font-weight="800">
        Effect claim
      </text>
      <text x="159" y="168" fill="#fde68a" font-size="10">
        presence, absence, or cardinality
      </text>
    </g>

    <path
      d="M284 137H960"
      fill="none"
      stroke="#fbbf24"
      stroke-width="2"
      marker-end="url(#claim-arrow)"
    />
    <text x="622" y="126" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="700">
      accepted before execution
    </text>

    <text x="34" y="220" fill="#86efac" font-size="10" font-weight="800">
      RUNTIME EVIDENCE
    </text>

    <g text-anchor="middle">
      <rect x="34" y="236" width="150" height="106" rx="10" fill="#111827" stroke="#64748b" />
      <text x="109" y="263" fill="#94a3b8" font-size="9" font-weight="800">RUNTIME</text>
      <text x="109" y="292" fill="#f8fafc" font-size="14" font-weight="800">Fresh attempt</text>
      <text x="109" y="316" fill="#cbd5e1" font-size="10">new capture scope</text>

      <rect x="207" y="236" width="165" height="106" rx="10" fill="#172554" stroke="#60a5fa" />
      <text x="289.5" y="263" fill="#93c5fd" font-size="9" font-weight="800">OBSERVATIONS</text>
      <text x="289.5" y="292" fill="#eff6ff" font-size="14" font-weight="800">OpenTelemetry</text>
      <text x="289.5" y="316" fill="#bfdbfe" font-size="10">spans from the run</text>

      <rect x="395" y="236" width="185" height="106" rx="10" fill="#10243f" stroke="#38bdf8" />
      <text x="487.5" y="263" fill="#7dd3fc" font-size="9" font-weight="800">CATALOG ADMISSION</text>
      <text x="487.5" y="292" fill="#f0f9ff" font-size="14" font-weight="800">Admit + normalize</text>
      <text x="487.5" y="316" fill="#bae6fd" font-size="10">supported + attributable</text>

      <rect x="603" y="236" width="140" height="106" rx="10" fill="#12302a" stroke="#34d399" />
      <text x="673" y="263" fill="#6ee7b7" font-size="9" font-weight="800">EFFECTS</text>
      <text x="673" y="292" fill="#ecfdf5" font-size="14" font-weight="800">Portable facts</text>
      <text x="673" y="316" fill="#a7f3d0" font-size="10">system boundaries</text>

      <rect x="766" y="236" width="180" height="106" rx="10" fill="#14301f" stroke="#4ade80" />
      <text x="856" y="263" fill="#86efac" font-size="9" font-weight="800">SEALED</text>
      <text x="856" y="292" fill="#f0fdf4" font-size="14" font-weight="800">Bounded evidence</text>
      <text x="856" y="316" fill="#bbf7d0" font-size="10">scope + integrity</text>
    </g>

    <line x1="184" y1="289" x2="197" y2="289" stroke="#94a3b8" stroke-width="2" marker-end="url(#observation-arrow)" />
    <line x1="372" y1="289" x2="385" y2="289" stroke="#94a3b8" stroke-width="2" marker-end="url(#observation-arrow)" />
    <line x1="580" y1="289" x2="593" y2="289" stroke="#94a3b8" stroke-width="2" marker-end="url(#observation-arrow)" />
    <line x1="743" y1="289" x2="756" y2="289" stroke="#94a3b8" stroke-width="2" marker-end="url(#observation-arrow)" />
    <line x1="946" y1="289" x2="960" y2="289" stroke="#4ade80" stroke-width="2" marker-end="url(#evidence-arrow)" />

    <g text-anchor="middle">
      <rect
        x="970"
        y="94"
        width="196"
        height="248"
        rx="11"
        fill="#2e1065"
        stroke="#c084fc"
        stroke-width="2"
      />
      <text x="1068" y="122" fill="#d8b4fe" font-size="9" font-weight="800">ANALYZER</text>
      <text x="1068" y="162" fill="#faf5ff" font-size="17" font-weight="800">Compare</text>
      <text x="1068" y="188" fill="#e9d5ff" font-size="11">accepted claim</text>
      <text x="1068" y="207" fill="#e9d5ff" font-size="11">+ sealed evidence</text>
      <rect x="1001" y="252" width="134" height="50" rx="8" fill="#42206f" stroke="#d8b4fe" />
      <text x="1068" y="273" fill="#d8b4fe" font-size="9" font-weight="800">OUTPUT</text>
      <text x="1068" y="292" fill="#faf5ff" font-size="14" font-weight="800">Finding</text>
    </g>

    <rect x="34" y="370" width="1132" height="32" rx="8" fill="#111827" stroke="#475569" />
    <text x="600" y="391" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="700">
      A span is evidence input, not automatically an effect. Observations never create or change the accepted claim.
    </text>
  </g>
</svg>
