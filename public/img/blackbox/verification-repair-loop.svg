    </text>

    <line
      x1="310"
      y1="115"
      x2="332"
      y2="115"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#arrow)"
    />

    <rect
      x="342"
      y="86"
      width="126"
      height="58"
      rx="7"
      fill="#1f2937"
      stroke="#94a3b8"
    />
    <text
      x="405"
      y="120"
      text-anchor="middle"
      fill="#f8fafc"
      font-size="11"
      font-weight="800"
    >
      Implementation
    </text>

    <line
      x1="468"
      y1="115"
      x2="490"
      y2="115"
      stroke="#94a3b8"
      stroke-width="2"
