    <text
      x="841"
      y="120"
      text-anchor="middle"
      fill="#fef3c7"
      font-size="11"
      font-weight="800"
    >
      Findings
    </text>

    <path
      d="M841 144V194H405V154"
      fill="none"
      stroke="#4ade80"
      stroke-width="2"
      stroke-dasharray="7 5"
      marker-end="url(#repair-arrow)"
    />
    <text
      x="623"
      y="215"
      text-anchor="middle"
      fill="#bbf7d0"
      font-size="11"
      font-weight="700"
    >
      agent repairs the implementation
    </text>
  </g>
</svg>
