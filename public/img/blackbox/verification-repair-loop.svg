    </text>

    <line
      x1="626"
      y1="115"
      x2="648"
      y2="115"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#arrow)"
    />

    <rect
      x="658"
      y="86"
      width="104"
      height="58"
      rx="7"
      fill="#12251e"
      stroke="#4ade80"
    />
    <text
      x="710"
      y="120"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="11"
      font-weight="800"
