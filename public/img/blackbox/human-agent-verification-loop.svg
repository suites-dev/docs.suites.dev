<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 540"
  role="img"
  aria-labelledby="loop-title loop-description"
>
  <title id="loop-title">Human-agent verification loop</title>
  <desc id="loop-description">
    Person-approved Gherkin becomes generated runtime bindings and TypeScript
    guidance. Those types guide a project-owned Playwright suite. The Blackbox
    CLI checks and prepares the run. The runner executes while Runtime captures
    fresh evidence. Findings return to the coding agent for repair, while
    changes to accepted behavior return to the person.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081120" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
    <marker id="repair" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4ade80" />
    </marker>
    <marker id="human" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect x="6" y="6" width="1188" height="528" rx="16" fill="url(#background)" stroke="#334155" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="34" y="42" fill="#f8fafc" font-size="20" font-weight="800">Accepted intent becomes a repair loop</text>

    <rect x="34" y="60" width="1132" height="30" rx="8" fill="#172554" stroke="#3b82f6" />
    <text x="51" y="80" fill="#93c5fd" font-size="11" font-weight="800">FEEDFORWARD</text>
    <text x="151" y="80" fill="#dbeafe" font-size="11">guidance before the agent acts</text>

    <g text-anchor="middle">
      <rect x="34" y="112" width="180" height="142" rx="10" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
      <text x="124" y="139" fill="#fde68a" font-size="9" font-weight="800">HUMAN APPROVED</text>
      <text x="124" y="176" fill="#fef3c7" font-size="17" font-weight="800">Gherkin</text>
      <text x="124" y="204" fill="#fde68a" font-size="11">scenario + effects</text>
      <text x="124" y="230" fill="#fbbf24" font-size="10" font-weight="700">accepted intent</text>
    </g>

    <g text-anchor="middle">
      <rect x="240" y="112" width="220" height="142" rx="10" fill="#172554" stroke="#818cf8" stroke-width="2" />
      <text x="350" y="139" fill="#a5b4fc" font-size="9" font-weight="800">GENERATED</text>
      <text x="350" y="174" fill="#eef2ff" font-size="16" font-weight="800">Typed guidance</text>
      <text x="350" y="202" fill="#c7d2fe" font-size="11">runtime bindings</text>
      <text x="350" y="223" fill="#c7d2fe" font-size="11">+ generated .d.ts</text>
    </g>

    <g text-anchor="middle">
      <rect x="486" y="112" width="210" height="142" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2" />
      <text x="591" y="139" fill="#c4b5fd" font-size="9" font-weight="800">PROJECT OWNED</text>
      <text x="591" y="174" fill="#f5f3ff" font-size="16" font-weight="800">Playwright suite</text>
      <text x="591" y="202" fill="#ddd6fe" font-size="11">suite.ts + bindings</text>
      <text x="591" y="226" fill="#c4b5fd" font-size="10" font-weight="700">person or agent writes</text>
    </g>

    <g text-anchor="middle">
      <rect x="722" y="112" width="210" height="142" rx="10" fill="#10243f" stroke="#38bdf8" stroke-width="2" />
      <text x="827" y="139" fill="#7dd3fc" font-size="9" font-weight="800">BLACKBOX CLI</text>
      <text x="827" y="174" fill="#f0f9ff" font-size="16" font-weight="800">Check + prepare</text>
      <text x="827" y="202" fill="#bae6fd" font-size="11">typecheck + discovery</text>
      <text x="827" y="226" fill="#38bdf8" font-size="10" font-weight="700">declared run</text>
    </g>

    <g text-anchor="middle">
      <rect x="958" y="112" width="208" height="142" rx="10" fill="#12302a" stroke="#34d399" stroke-width="2" />
      <text x="1062" y="139" fill="#6ee7b7" font-size="9" font-weight="800">RUNTIME</text>
      <text x="1062" y="174" fill="#ecfdf5" font-size="16" font-weight="800">Execute + capture</text>
      <text x="1062" y="202" fill="#a7f3d0" font-size="11">runner executes</text>
      <text x="1062" y="223" fill="#a7f3d0" font-size="11">fresh runtime evidence</text>
    </g>

    <line x1="214" y1="183" x2="230" y2="183" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="460" y1="183" x2="476" y2="183" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="696" y1="183" x2="712" y2="183" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="932" y1="183" x2="948" y2="183" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="34" y="284" width="1132" height="30" rx="8" fill="#14301f" stroke="#22c55e" />
    <text x="51" y="304" fill="#86efac" font-size="11" font-weight="800">FEEDBACK</text>
    <text x="123" y="304" fill="#dcfce7" font-size="11">results after checks and execution</text>

    <g text-anchor="middle">
      <rect x="62" y="352" width="210" height="116" rx="10" fill="#3b2f0b" stroke="#fbbf24" stroke-width="2" />
      <text x="167" y="379" fill="#fde68a" font-size="9" font-weight="800">HUMAN AUTHORITY</text>
      <text x="167" y="415" fill="#fef3c7" font-size="17" font-weight="800">Person</text>
      <text x="167" y="442" fill="#fde68a" font-size="11">approves target</text>
      <text x="167" y="459" fill="#fde68a" font-size="11">and policy changes</text>
    </g>

    <g text-anchor="middle">
      <rect x="342" y="352" width="246" height="116" rx="10" fill="#2e1065" stroke="#a78bfa" stroke-width="2" />
      <text x="465" y="379" fill="#c4b5fd" font-size="9" font-weight="800">INFERENTIAL WORK</text>
      <text x="465" y="415" fill="#f5f3ff" font-size="16" font-weight="800">Coding agent + Skills</text>
      <text x="465" y="442" fill="#ddd6fe" font-size="11">repair suite, bindings,</text>
      <text x="465" y="459" fill="#ddd6fe" font-size="11">or implementation</text>
    </g>

    <g text-anchor="middle">
      <rect x="696" y="352" width="442" height="116" rx="10" fill="#14301f" stroke="#4ade80" stroke-width="2" />
      <text x="917" y="379" fill="#86efac" font-size="9" font-weight="800">ANALYZER</text>
      <text x="917" y="415" fill="#f0fdf4" font-size="17" font-weight="800">Integrity + effect findings</text>
      <text x="917" y="442" fill="#bbf7d0" font-size="11">deterministic feedback from runtime evidence</text>
      <text x="917" y="459" fill="#d8b4fe" font-size="9">Observable Decision Coverage stays separate</text>
    </g>

    <path d="M1062 254v88" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <line x1="696" y1="410" x2="598" y2="410" stroke="#4ade80" stroke-width="2.5" marker-end="url(#repair)" />

    <path d="M827 254v74H465v14" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#repair)" />
    <text x="650" y="339" text-anchor="middle" fill="#86efac" font-size="9" font-weight="700">type feedback</text>

    <path d="M465 352v-26h126v-62" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#repair)" />
    <text x="524" y="339" text-anchor="middle" fill="#bbf7d0" font-size="9" font-weight="700">repair and rerun</text>

    <line x1="342" y1="410" x2="282" y2="410" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#human)" />
    <path d="M167 352v-26h-43v-62" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#human)" />

    <text x="1166" y="508" text-anchor="end" fill="#64748b" font-size="9">Alpha target flow</text>
  </g>
</svg>
