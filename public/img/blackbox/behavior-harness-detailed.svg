<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1040 560"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Blackbox inside a coding-agent harness</title>
  <desc id="desc">
    People steer the desired state. Accepted behavior, architecture, and
    constraints guide a coding agent before it acts. The agent changes the
    implementation, which becomes running software. Other computational controls
    and inferential review evaluate the implementation. Blackbox provides
    deterministic behavioral feedback from the running software. Feedback
    returns to the agent, while proposed target changes return to people.
  </desc>
