<svg
  xmlns="http://www.w3.org/2000/svg"
  width="820"
  height="370"
  viewBox="0 0 820 370"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Accepted intent to Gherkin, system suite, and runtime evidence
  </title>
  <desc id="desc">
    One continuous flow expresses human-approved intent as readable Gherkin and
    an executable system-test suite. Runtime evidence records what occurred.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect
    x="8"
    y="8"
    width="804"
    height="354"
    rx="10"
    fill="#0b1120"
    stroke="#334155"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="30" y="43" fill="#f8fafc" font-size="19" font-weight="800">
      From accepted intent to runtime evidence
    </text>
    <text x="30" y="67" fill="#cbd5e1" font-size="12">
      The representation changes. The accepted intent stays fixed.
    </text>

    <path
      d="M30 126H164L190 152V274H30Z"
      fill="#3b2f0b"
      stroke="#fbbf24"
      stroke-width="2"
    />
    <path
      d="M164 126V152H190"
      fill="#1f2937"
      stroke="#fbbf24"
      stroke-width="2"
    />
    <text x="49" y="152" fill="#fde68a" font-size="10" font-weight="800">
      ACCEPTED
    </text>
    <text
      x="110"
      y="198"
      text-anchor="middle"
      fill="#fef3c7"
      font-size="17"
      font-weight="800"
    >
      Specification
    </text>
    <text x="110" y="225" text-anchor="middle" fill="#fde68a" font-size="12">
      Human-approved intent
    </text>

    <line
      x1="190"
      y1="201"
      x2="220"
      y2="201"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text
      x="205"
      y="188"
      text-anchor="middle"
      fill="#cbd5e1"
      font-size="9"
      font-weight="700"
