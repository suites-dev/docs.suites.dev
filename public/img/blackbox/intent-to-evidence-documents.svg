    </text>

    <rect
      x="91"
      y="306"
      width="638"
      height="28"
      rx="14"
      fill="#111827"
      stroke="#475569"
    />
    <text
      x="410"
      y="325"
      text-anchor="middle"
      fill="#cbd5e1"
      font-size="11"
      font-weight="700"
