    </text>

    <line
      x1="390"
      y1="201"
      x2="420"
      y2="201"
      stroke="#94a3b8"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text
      x="405"
      y="188"
      text-anchor="middle"
      fill="#cbd5e1"
      font-size="9"
      font-weight="700"
