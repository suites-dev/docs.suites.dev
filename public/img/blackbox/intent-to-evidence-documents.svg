      <tspan x="605">run +</tspan>
      <tspan x="605" dy="10">capture</tspan>
    </text>

    <path
      d="M630 126H764L790 152V274H630Z"
      fill="#12251e"
      stroke="#4ade80"
      stroke-width="2"
    />
    <path
      d="M764 126V152H790"
      fill="#1f2937"
      stroke="#4ade80"
      stroke-width="2"
    />
    <text x="649" y="152" fill="#86efac" font-size="10" font-weight="800">
      OBSERVED
    </text>
    <text
      x="710"
      y="198"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="16"
      font-weight="800"
    >
      Runtime evidence
    </text>
    <text x="710" y="225" text-anchor="middle" fill="#bbf7d0" font-size="12">
