    </text>

    <path
      d="M430 126H564L590 152V274H430Z"
      fill="#172554"
      stroke="#60a5fa"
      stroke-width="2"
    />
    <path
      d="M564 126V152H590"
      fill="#1f2937"
      stroke="#60a5fa"
      stroke-width="2"
    />
    <text x="449" y="152" fill="#93c5fd" font-size="10" font-weight="800">
