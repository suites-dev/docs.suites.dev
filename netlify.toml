# ===========================================
# SITEMAP
# ===========================================
# robots.txt and Search Console both point at /sitemap.xml. @astrojs/sitemap
# writes sitemap-index.xml, so serve it under the path crawlers already know
# rather than changing the advertised URL.

[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 200

