# ===========================================
# BUILD
# ===========================================
# `pnpm build` runs scripts/algolia-reindex.mjs as a postbuild step, which
# triggers an Algolia DocSearch crawler reindex after every successful
# production build. The script is a no-op for deploy previews and branch
# deploys, and a no-op (with a warning) if crawler env vars are missing,
# so it cannot break the build.
#
# Required env vars in Netlify → Site settings → Environment variables:
#   ALGOLIA_CRAWLER_USER_ID
#   ALGOLIA_CRAWLER_API_KEY
#   ALGOLIA_CRAWLER_ID

[build]
command = "pnpm build"
publish = "dist"

# Pinned rather than left to the dashboard toggle, because file configuration
# overrides UI configuration. Pretty URLs serves the slash-terminated form,
# which is what `trailingSlash: "always"` in astro.config.mjs declares as
# canonical. The two settings must agree or every page redirects away from
# its own canonical URL.
[build.processing.html]
pretty_urls = true

# ===========================================
# CRITICAL REDIRECTS (High Traffic Pages)
